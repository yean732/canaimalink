<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CanaimaLink</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="theme-light">

    <!-- Modal Login / Registro -->
    <div id="auth-modal" class="modal flex-center">
        <div class="modal-card">
            <h2>CanaimaLink</h2>
            <input type="text" id="auth-username" placeholder="Apodo">
            <div class="input-eye-container">
                <input type="password" id="auth-password" placeholder="Contraseña">
                <button type="button" id="btn-toggle-login-pass" class="icon-btn">👁️</button>
            </div>
            <button id="btn-login" class="primary-btn">Ingresar / Registrarme</button>
            <p id="auth-error" class="error-msg"></p>
        </div>
    </div>

    <div class="app-container">
        <!-- Sidebar -->
        <aside id="app-sidebar" class="sidebar">
            <header class="sidebar-header">
                <div class="user-profile-summary">
                    <span id="current-user-avatar" class="avatar-box">🤖</span>
                    <span id="current-user-name">Cargando...</span>
                </div>
                <button id="btn-install-pwa" class="icon-btn hidden" title="Instalar App">📲</button>
                <button id="btn-open-settings" class="icon-btn">⚙️</button>
            </header>

            <div class="search-bar-container">
                <input type="text" id="search-input" placeholder="Buscar amigos o grupos...">
            </div>

            <nav class="nav-tabs">
                <button id="tab-chats" class="tab-btn active">Chats</button>
                <button id="tab-groups" class="tab-btn">Grupos</button>
            </nav>

            <div class="actions-bar">
                <button id="btn-add-contact" class="action-btn">+ Contacto</button>
                <button id="btn-create-group" class="action-btn">+ Grupo</button>
            </div>

            <div id="list-container" class="list-container"></div>
        </aside>

        <!-- Área de Chat -->
        <main id="app-chat-area" class="chat-area mobile-hidden">
            <header id="chat-header" class="chat-header hidden">
                <div class="chat-title-info">
                    <button id="btn-back-chat" class="icon-btn btn-back-mobile">⬅️</button>
                    <span id="chat-target-avatar" class="avatar-box">👤</span>
                    <div>
                        <h3 id="chat-target-name">Selecciona un chat</h3>
                        <div id="typing-indicator" class="typing-indicator"></div>
                    </div>
                </div>
                <div class="chat-header-actions">
                    <button id="btn-poll" class="icon-btn" title="Crear Encuesta">📊</button>
                    <button id="btn-add-group-member" class="icon-btn hidden" title="Añadir miembro">👤+</button>
                    <button id="btn-leave-group" class="icon-btn hidden" title="Salir">🚪</button>
                    <button id="btn-clear-chat" class="icon-btn" title="Vaciar chat">🗑️</button>
                </div>
            </header>

            <div id="messages-container" class="messages-container">
                <div class="placeholder-chat">
                    <h2>CanaimaLink App</h2>
                    <p>Conéctate con tus amigos en tiempo real.</p>
                </div>
            </div>

            <!-- Menú autocompletar menciones -->
            <div id="mentions-dropdown" class="mentions-dropdown hidden"></div>

            <footer id="chat-footer" class="chat-footer hidden">
                <div class="emoji-picker-wrapper">
                    <button id="btn-emoji" class="icon-btn">😊</button>
                    <div id="emoji-dropdown" class="emoji-dropdown hidden">
                        <span>😀</span><span>😂</span><span>😍</span><span>👍</span><span>🔥</span><span>🎉</span>
                        <span>❤️</span><span>🚀</span><span>😎</span><span>🙌</span><span>💩</span><span>💀</span>
                    </div>
                </div>
                <button id="btn-attach" class="icon-btn" title="Enviar Foto/Archivo">📎</button>
                <input type="file" id="file-input" class="hidden" accept="image/*">
                
                <input type="text" id="message-input" placeholder="Escribe un mensaje... (@ para mencionar)">
                <button id="btn-send" class="send-btn">Enviar</button>
            </footer>
        </main>
    </div>

    <!-- Modal Ajustes Completo -->
    <div id="settings-modal" class="modal hidden">
        <div class="full-screen-modal">
            <div class="modal-header-nav">
                <button id="btn-close-settings" class="icon-btn">⬅️ Volver</button>
                <h2>Ajustes y Personalización</h2>
            </div>

            <div class="form-group">
                <label><strong>Tema de la Aplicación:</strong></label>
                <div class="theme-switch-container">
                    <button id="btn-theme-light" class="action-btn">☀️ Claro</button>
                    <button id="btn-theme-dark" class="action-btn">🌙 Oscuro</button>
                </div>
            </div>

            <div class="form-group">
                <label><strong>Color de tus Burbujas de Chat:</strong></label>
                <div class="color-options">
                    <div class="color-circle selected" style="background: #3a86ff;" data-color="#3a86ff"></div>
                    <div class="color-circle" style="background: #ec4899;" data-color="#ec4899"></div>
                    <div class="color-circle" style="background: #8b5cf6;" data-color="#8b5cf6"></div>
                    <div class="color-circle" style="background: #ef4444;" data-color="#ef4444"></div>
                    <div class="color-circle" style="background: #10b981;" data-color="#10b981"></div>
                    <div class="color-circle" style="background: #f59e0b;" data-color="#f59e0b"></div>
                </div>
            </div>

            <div class="form-group">
                <label><strong>Modo de Espaciado:</strong></label>
                <select id="compact-selector">
                    <option value="normal">Espaciado Normal</option>
                    <option value="compact">Modo Compacto (Mensajes juntos)</option>
                </select>
            </div>

            <div class="form-group">
                <label><strong>URL de Imagen de Fondo para el Chat:</strong></label>
                <input type="text" id="bg-url-input" placeholder="https://ejemplo.com/fondo.jpg">
            </div>

            <div class="form-group">
                <label><strong>Nuevo Apodo:</strong></label>
                <input type="text" id="settings-username" placeholder="Tu apodo">
            </div>

            <div class="form-group">
                <label><strong>Avatar:</strong></label>
                <div class="avatar-selector">
                    <span class="avatar-option">🤖</span><span class="avatar-option">🦊</span>
                    <span class="avatar-option">🐱</span><span class="avatar-option">🚀</span>
                    <span class="avatar-option">🎓</span><span class="avatar-option">👑</span>
                    <span class="avatar-option">👾</span><span class="avatar-option">🦁</span>
                    <span class="avatar-option">🐉</span><span class="avatar-option">🍕</span>
                    <span class="avatar-option">⚽</span><span class="avatar-option">🎧</span>
                </div>
            </div>

            <div class="form-group">
                <label><strong>Cambiar Contraseña:</strong></label>
                <div class="input-eye-container">
                    <input type="password" id="settings-password" placeholder="Nueva contraseña">
                    <button type="button" id="btn-toggle-settings-pass" class="icon-btn">👁️</button>
                </div>
            </div>

            <div class="form-group">
                <button id="btn-save-settings" class="primary-btn" style="max-width: 220px;">Guardar Todo</button>
                <button id="btn-logout" class="action-btn" style="background: #ef4444; max-width: 220px; margin-top: 15px;">Cerrar Sesión</button>
            </div>
        </div>
    </div>

    <!-- Lightbox (Galería Flotante) -->
    <div id="lightbox-modal" class="lightbox-modal hidden">
        <button id="btn-close-lightbox" class="icon-btn" style="position: absolute; top: 20px; right: 20px; color: white; font-size: 2rem;">✖️</button>
        <img id="lightbox-img" class="lightbox-img" src="" alt="Vista previa">
        <a id="lightbox-download" href="" download class="primary-btn" style="margin-top: 15px; text-decoration: none;">Descargar Imagen</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
