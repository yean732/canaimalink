<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CanaimaLink</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="theme-light">

    <!-- Login -->
    <div id="auth-modal" class="modal flex-center">
        <div class="modal-card">
            <h2>CanaimaLink</h2>
            <input type="text" id="auth-username" placeholder="Apodo" style="padding: 8px; border-radius: 6px; border: 1px solid #ccc;">
            <input type="password" id="auth-password" placeholder="Contraseña" style="padding: 8px; border-radius: 6px; border: 1px solid #ccc;">
            <button id="btn-login" class="primary-btn">Ingresar / Registrarme</button>
            <p id="auth-error" class="error-msg"></p>
        </div>
    </div>

    <div class="app-container">
        <!-- Sidebar -->
        <aside id="app-sidebar" class="sidebar">
            <header class="sidebar-header">
                <div class="user-profile-summary" style="display: flex; align-items: center; gap: 10px;">
                    <div class="avatar-wrapper">
                        <div id="current-user-avatar" class="avatar-box">🤖</div>
                        <div class="online-dot"></div>
                    </div>
                    <span id="current-user-name" style="font-weight: bold;">Cargando...</span>
                </div>
                <button id="btn-open-settings" class="icon-btn">⚙️</button>
            </header>

            <div class="search-bar-container">
                <input type="text" id="search-input" placeholder="Buscar...">
            </div>

            <div class="actions-bar">
                <button id="btn-add-contact" class="action-btn">+ Contacto</button>
                <button id="btn-create-group" class="action-btn">+ Grupo</button>
            </div>

            <div id="list-container" class="list-container"></div>

            <!-- Navegación Abajo estilo WhatsApp -->
            <nav class="nav-tabs-bottom">
                <button id="tab-chats" class="tab-btn active">
                    <span>💬</span>
                    <span>Chats</span>
                </button>
                <button id="tab-groups" class="tab-btn">
                    <span>👥</span>
                    <span>Grupos</span>
                </button>
            </nav>
        </aside>

        <!-- Chat Area -->
        <main id="app-chat-area" class="chat-area mobile-hidden">
            <header id="chat-header" class="chat-header hidden">
                <div class="chat-title-info">
                    <button id="btn-back-chat" class="icon-btn btn-back-mobile">⬅️</button>
                    <div class="avatar-wrapper">
                        <div id="chat-target-avatar" class="avatar-box">👤</div>
                        <div id="chat-target-status-dot" class="online-dot hidden"></div>
                    </div>
                    <div>
                        <h3 id="chat-target-name">Selecciona un chat</h3>
                        <div id="typing-indicator" style="font-size:0.75rem; color:#22c55e; min-height: 16px;"></div>
                    </div>
                </div>
                <div>
                    <button id="btn-create-poll" class="icon-btn" title="Crear Encuesta">📊</button>
                </div>
            </header>

            <div id="messages-container" class="messages-container">
                <div class="placeholder-chat">
                    <h2>CanaimaLink Messenger</h2>
                    <p>Selecciona un contacto para comenzar a chatear.</p>
                </div>
            </div>

            <footer id="chat-footer" class="chat-footer hidden">
                <!-- Picker de Emojis -->
                <button id="btn-toggle-emojis" class="icon-btn" title="Emojis">😀</button>
                <div id="emoji-picker" class="emoji-picker-popup hidden">
                    <span>😀</span><span>😂</span><span>😍</span><span>😎</span><span>👍</span>
                    <span>🔥</span><span>🎉</span><span>❤️</span><span>🙏</span><span>😊</span>
                    <span>🥳</span><span>🤔</span><span>👏</span><span>💪</span><span>✨</span>
                    <span>🚀</span><span>🇻🇪</span><span>💻</span><span>🎤</span><span>📷</span>
                </div>

                <button id="btn-attach" class="icon-btn" title="Adjuntar Imagen/PDF/Audio">📎</button>
                <input type="file" id="file-input" class="hidden" accept="image/*,application/pdf,audio/*">
                
                <input type="text" id="message-input" placeholder="Escribe un mensaje...">
                <button id="btn-record-audio" class="icon-btn" title="Enviar Audio">🎤</button>
                <button id="btn-send" class="send-btn">Enviar</button>
            </footer>
        </main>
    </div>

    <!-- Modal Ajustes -->
    <div id="settings-modal" class="modal hidden">
        <div class="full-screen-modal">
            <div style="display: flex; align-items: center; gap: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">
                <button id="btn-close-settings" class="icon-btn">⬅️ Volver</button>
                <h2>Ajustes Personales</h2>
            </div>

            <div class="form-group">
                <label><strong>Tema de la App:</strong></label>
                <div style="display: flex; gap: 10px;">
                    <button id="btn-theme-light" class="action-btn">☀️ Claro</button>
                    <button id="btn-theme-dark" class="action-btn">🌙 Oscuro</button>
                </div>
            </div>

            <div class="form-group">
                <label><strong>Tamaño de Letra del Chat:</strong></label>
                <select id="select-font-size" style="padding: 8px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--input-bg); color: inherit;">
                    <option value="0.85rem">Pequeño</option>
                    <option value="0.95rem" selected>Mediano</option>
                    <option value="1.1rem">Grande</option>
                </select>
            </div>

            <div class="form-group">
                <label><strong>Separación entre Mensajes:</strong></label>
                <select id="select-msg-gap" style="padding: 8px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--input-bg); color: inherit;">
                    <option value="4px">Pequeño (Apretado)</option>
                    <option value="10px" selected>Mediano (Normal)</option>
                    <option value="18px">Grande (Espaciado)</option>
                </select>
            </div>

            <div class="form-group">
                <label><strong>Forma / Animal de la Burbuja de Mensaje:</strong></label>
                <select id="select-bubble-shape" style="padding: 8px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--input-bg); color: inherit;">
                    <option value="shape-normal">Normal (Bordes Suaves)</option>
                    <option value="shape-redonda">Redonda</option>
                    <option value="shape-cuadrada">Cuadrada</option>
                    <option value="shape-perro">🐶 Perro</option>
                    <option value="shape-gato">🐱 Gato</option>
                    <option value="shape-rana">🐸 Rana</option>
                    <option value="shape-serpiente">🐍 Serpiente</option>
                    <option value="shape-buho">🦉 Búho</option>
                    <option value="shape-pajaro">🐦 Pájaro</option>
                    <option value="shape-cuervo">🦅 Cuervo</option>
                </select>
            </div>

            <div class="form-group">
                <label><strong>Fondo de Pantalla del Chat:</strong></label>
                <input type="file" id="bg-file-input" accept="image/*" style="margin-bottom: 5px;">
                <button id="btn-reset-bg" class="action-btn" style="background:#64748b; max-width: 180px;">Restablecer Fondo</button>
            </div>

            <div class="form-group">
                <label><strong>Color de tus Burbujas (Visible para todos):</strong></label>
                <div class="color-options">
                    <div class="color-circle selected" style="background: #3a86ff;" data-color="#3a86ff"></div>
                    <div class="color-circle" style="background: #ec4899;" data-color="#ec4899"></div>
                    <div class="color-circle" style="background: #8b5cf6;" data-color="#8b5cf6"></div>
                    <div class="color-circle" style="background: #ef4444;" data-color="#ef4444"></div>
                    <div class="color-circle" style="background: #10b981;" data-color="#10b981"></div>
                    <div class="color-circle" style="background: #f59e0b;" data-color="#f59e0b"></div>
                </div>
            </div>

            <div class="form-group">
                <label><strong>Foto de Perfil Personalizada:</strong></label>
                <input type="file" id="profile-img-input" accept="image/*" style="margin-bottom: 5px;">
                <label style="font-size:0.8rem; opacity:0.8;">O elige uno de los 20+ Avatares:</label>
                <div class="avatar-selector">
                    <span class="avatar-option selected">🤖</span><span class="avatar-option">🦊</span>
                    <span class="avatar-option">🐱</span><span class="avatar-option">🚀</span>
                    <span class="avatar-option">🎓</span><span class="avatar-option">👑</span>
                    <span class="avatar-option">🐶</span><span class="avatar-option">🐸</span>
                    <span class="avatar-option">🐍</span><span class="avatar-option">🦉</span>
                    <span class="avatar-option">🐦</span><span class="avatar-option">🦅</span>
                    <span class="avatar-option">🦁</span><span class="avatar-option">🐯</span>
                    <span class="avatar-option">🐼</span><span class="avatar-option">🦄</span>
                    <span class="avatar-option">⚽</span><span class="avatar-option">🎮</span>
                    <span class="avatar-option">🎨</span><span class="avatar-option">🍕</span>
                </div>
            </div>

            <div class="form-group">
                <label><strong>Nuevo Apodo:</strong></label>
                <input type="text" id="settings-username" placeholder="Tu apodo" style="padding: 8px; border-radius: 6px; border: 1px solid var(--border-color);">
            </div>

            <div class="form-group">
                <button id="btn-save-settings" class="primary-btn" style="max-width: 220px;">Guardar Cambios</button>
                <button id="btn-logout" class="action-btn" style="background: #ef4444; max-width: 220px; margin-top: 15px;">Cerrar Sesión</button>
            </div>
        </div>
    </div>

    <!-- Modal Encuestas -->
    <div id="poll-modal" class="modal hidden flex-center">
        <div class="modal-card">
            <h3>Crear Encuesta</h3>
            <input type="text" id="poll-question" placeholder="Pregunta" style="padding: 8px; border-radius: 6px; border: 1px solid #ccc;">
            <input type="text" id="poll-opt1" placeholder="Opción 1" style="padding: 8px; border-radius: 6px; border: 1px solid #ccc;">
            <input type="text" id="poll-opt2" placeholder="Opción 2" style="padding: 8px; border-radius: 6px; border: 1px solid #ccc;">
            <input type="text" id="poll-opt3" placeholder="Opción 3 (Opcional)" style="padding: 8px; border-radius: 6px; border: 1px solid #ccc;">
            <div style="display: flex; gap: 8px;">
                <button id="btn-send-poll" class="primary-btn">Crear</button>
                <button id="btn-close-poll" class="action-btn" style="background:#64748b;">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
